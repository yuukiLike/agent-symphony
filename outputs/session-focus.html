<div id="symphony-session-sketch" aria-label="Agent Symphony 会话与调用交互草图">
  <style>
    #symphony-session-sketch{--ss-bg:light-dark(#faf9f6,#171a1c);--ss-panel:light-dark(#f0efea,#222729);--ss-ink:light-dark(#243130,#e5ebe7);--ss-muted:light-dark(#59655f,#a7b5ae);--ss-line:light-dark(#d6dbd4,#3e4944);--ss-accent:light-dark(#236a50,#9dcab6);--ss-select:light-dark(#e0eee5,#293f35);--ss-warn:light-dark(#855025,#e6b98d);color:var(--ss-ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;width:100%;max-width:736px;margin:auto}
    #symphony-session-sketch *{box-sizing:border-box}
    #symphony-session-sketch .ss-shell{background:var(--ss-bg);border:1px solid var(--ss-line);border-radius:14px;overflow:hidden}
    #symphony-session-sketch button{font:inherit;color:inherit;border:0;background:none;text-align:left}
    #symphony-session-sketch .ss-chrome{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;padding:15px 18px;border-bottom:1px solid var(--ss-line)}
    #symphony-session-sketch .ss-brand{font-weight:500;letter-spacing:.015em}
    #symphony-session-sketch .ss-small{font-size:12px;color:var(--ss-muted)}
    #symphony-session-sketch .ss-sessions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px;background:var(--ss-panel);border-bottom:1px solid var(--ss-line)}
    #symphony-session-sketch .ss-session{padding:9px 11px;border-radius:7px;min-width:0;display:flex;flex-direction:column;gap:2px}
    #symphony-session-sketch .ss-session[aria-pressed="true"]{background:var(--ss-bg);box-shadow:inset 0 0 0 1px var(--ss-line)}
    #symphony-session-sketch .ss-session-title{font-weight:500;overflow-wrap:anywhere}
    #symphony-session-sketch .ss-session-meta{font-size:12px;color:var(--ss-muted);display:flex;flex-wrap:wrap;gap:3px 8px}
    #symphony-session-sketch .ss-session[aria-pressed="true"] .ss-session-title{color:var(--ss-accent)}
    #symphony-session-sketch .ss-main{padding:18px}
    #symphony-session-sketch .ss-heading{display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:17px}
    #symphony-session-sketch .ss-title{font-size:17px;font-weight:500;margin:0 0 3px}
    #symphony-session-sketch .ss-position{font-size:12px;background:var(--ss-panel);padding:5px 8px;border-radius:5px;white-space:nowrap}
    #symphony-session-sketch .ss-scope{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:-3px 0 14px;font-size:12px;color:var(--ss-muted)}
    #symphony-session-sketch .ss-scope select{font:inherit;color:var(--ss-ink);background:var(--ss-bg);border:1px solid var(--ss-line);border-radius:6px;padding:6px 8px;max-width:100%}
    #symphony-session-sketch .ss-axis{display:grid;grid-template-columns:130px minmax(0,1fr) 72px;gap:12px;margin-bottom:7px;font-size:12px;color:var(--ss-muted)}
    #symphony-session-sketch .ss-ticks{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
    #symphony-session-sketch .ss-calls{display:flex;flex-direction:column;gap:4px}
    #symphony-session-sketch .ss-call{width:100%;display:grid;grid-template-columns:130px minmax(0,1fr) 72px;gap:12px;align-items:center;padding:9px 8px;border-radius:7px;min-height:54px}
    #symphony-session-sketch .ss-call[aria-pressed="true"]{background:var(--ss-select)}
    #symphony-session-sketch .ss-call-name{display:block;font-weight:500;font-size:13px;overflow-wrap:anywhere}
    #symphony-session-sketch .ss-call-who{display:block;font-size:12px;color:var(--ss-muted)}
    #symphony-session-sketch .ss-track{height:18px;position:relative;background:linear-gradient(var(--ss-line),var(--ss-line)) center/100% 1px no-repeat}
    #symphony-session-sketch .ss-bar{position:absolute;top:6px;height:6px;min-width:6px;border-radius:3px;background:var(--ss-accent);opacity:.8}
    #symphony-session-sketch .ss-bar:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--ss-accent);left:0;top:-.5px}
    #symphony-session-sketch .ss-bar:after{content:"";position:absolute;right:0;top:-3px;width:2px;height:12px;background:var(--ss-accent)}
    #symphony-session-sketch .ss-bar.ss-open{background:repeating-linear-gradient(90deg,var(--ss-accent) 0 4px,transparent 4px 7px)}
    #symphony-session-sketch .ss-bar.ss-open:after{height:8px;width:8px;right:-2px;top:-1px;border:1.5px solid var(--ss-accent);border-radius:50%;background:var(--ss-bg)}
    #symphony-session-sketch .ss-result{font-size:12px;text-align:right;color:var(--ss-muted)}
    #symphony-session-sketch .ss-result.ss-fail{color:var(--ss-warn)}
    #symphony-session-sketch .ss-legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin:10px 8px 17px;font-size:12px;color:var(--ss-muted)}
    #symphony-session-sketch .ss-detail{border-top:1px solid var(--ss-line);padding-top:14px}
    #symphony-session-sketch .ss-detail-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    #symphony-session-sketch .ss-detail-title{font-weight:500}
    #symphony-session-sketch .ss-action{border:1px solid var(--ss-line);border-radius:6px;background:var(--ss-bg);padding:6px 10px;font-size:12px;white-space:nowrap}
    #symphony-session-sketch .ss-call-io{display:grid;grid-template-columns:42px minmax(0,1fr);gap:5px 9px;margin:0;font-size:13px}
    #symphony-session-sketch .ss-call-io dt{color:var(--ss-muted)}
    #symphony-session-sketch .ss-call-io dd{margin:0;overflow-wrap:anywhere}
    #symphony-session-sketch .ss-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;font-variant-numeric:tabular-nums}
    #symphony-session-sketch .ss-sound{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 18px;background:var(--ss-panel);border-top:1px solid var(--ss-line)}
    #symphony-session-sketch .ss-sound-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    #symphony-session-sketch .ss-sound-label{font-size:12px;color:var(--ss-muted)}
    #symphony-session-sketch .ss-sound-mode{font-size:12px;font-weight:500;color:var(--ss-accent)}
    #symphony-session-sketch .ss-audio-mark{width:16px;display:inline-flex;align-items:center;justify-content:space-between;height:15px;color:var(--ss-accent)}
    #symphony-session-sketch .ss-audio-mark span{width:2px;background:currentColor;height:7px}
    #symphony-session-sketch .ss-audio-mark span:nth-child(2){height:14px}
    #symphony-session-sketch .ss-audio-mark span:nth-child(3){height:10px}
    #symphony-session-sketch .ss-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:470px){#symphony-session-sketch .ss-main{padding:14px 10px}#symphony-session-sketch .ss-chrome,#symphony-session-sketch .ss-sound{padding:12px}#symphony-session-sketch .ss-sessions{gap:2px;padding:6px}#symphony-session-sketch .ss-session{padding:8px 6px}#symphony-session-sketch .ss-session-title{font-size:13px}#symphony-session-sketch .ss-session-meta{display:block;font-size:11px}#symphony-session-sketch .ss-session-meta span{display:block}#symphony-session-sketch .ss-axis,#symphony-session-sketch .ss-call{grid-template-columns:84px minmax(0,1fr) 60px;gap:7px}#symphony-session-sketch .ss-call{padding:8px 4px}#symphony-session-sketch .ss-call-name{font-size:12px}#symphony-session-sketch .ss-call-who{font-size:11px}#symphony-session-sketch .ss-axis{padding:0 4px}#symphony-session-sketch .ss-result{font-size:11px}#symphony-session-sketch .ss-title{font-size:16px}}
    @media(pointer:coarse){#symphony-session-sketch .ss-action{min-height:44px}#symphony-session-sketch .ss-session{min-height:68px}}
  </style>
  <div class="ss-shell">
    <div class="ss-chrome"><span class="ss-brand">Agent Symphony</span><span class="ss-small">模拟数据 · 声音仅示意</span></div>

      <button type="button" class="ss-session cursor-interaction" data-session="a72" aria-pressed="false"><span class="ss-session-title">检查测试</span><span class="ss-session-meta"><span>Claude Code · #a72</span><span>等待输入</span></span></button>
      <button type="button" class="ss-session cursor-interaction" data-session="d09" aria-pressed="false"><span class="ss-session-title">审阅文档</span><span class="ss-session-meta"><span>dsh · #d09</span><span>已结束</span></span></button>
    </nav>
    <section class="ss-main" aria-label="当前会话调用过程">
      <div class="ss-heading"><div><h2 class="ss-title" data-title>修复登录</h2><div class="ss-small" data-identity>Codex · #c41 · 模拟快照 00:12.0</div></div><span class="ss-position" data-position>查看：调用 #4</span></div>
      <div class="ss-scope"><label for="ss-skill-focus">Skill 调用</label><select id="ss-skill-focus" data-skill aria-label="筛选当前会话的 Skill 调用"></select><span>相关记录 · 保留起止</span></div>
      <div class="ss-axis" aria-hidden="true"><span>事件 / 执行者</span><span class="ss-ticks"><span>00:00</span><span data-axis-end>00:12</span></span><span style="text-align:right">结果</span></div>
      <div class="ss-calls" data-calls></div>

      <section class="ss-detail" aria-label="选中调用详情"><div class="ss-detail-top"><span class="ss-detail-title" data-detail-title>调用 #4</span><button type="button" class="ss-action cursor-interaction" data-replay>示意回放此调用</button></div><dl class="ss-call-io" data-detail></dl></section>
    </section>
    <div class="ss-sound" aria-label="当前声音焦点"><div><div class="ss-sound-line"><span class="ss-audio-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="ss-sound-label">声音焦点</span><span data-sound-session>Codex · #c41</span></div><div class="ss-small" data-sound-detail>实时 · 查看旧调用时，声音仍跟随本会话</div></div><button type="button" class="ss-action cursor-interaction" data-live hidden>回到实时声音</button></div>
    <div class="ss-sr" aria-live="polite" data-announcement></div>
  </div>
  <script>
    (()=>{
      const root=document.getElementById('symphony-session-sketch');
      const sessions={
        c41:{title:'修复登录',host:'Codex',status:'活跃',end:12,calls:[
          {id:1,name:'加载上下文',who:'主 agent',start:0,end:0.4,result:'已完成',input:'任务上下文与 investigate/SKILL.md',output:'观察到加载；加载本身不证明后续事件归属'},
          {id:2,name:'读取文件',who:'主 agent',start:0.6,end:1.2,result:'已返回',input:'src/auth/login.ts',output:'读取完成 · 86 行'},
          {id:3,name:'修改文件',who:'主 agent',start:1.7,end:2.6,result:'已返回',input:'src/auth/login.ts · 更新会话判断',output:'修改已应用'},
          {id:4,name:'委派检查',who:'主 agent',start:2.8,end:3.0,result:'已接收',input:'请求检查 agent 验证登录分支',output:'关联任务 task-02；不代表子任务已完成'},
          {id:5,name:'运行测试',who:'检查 agent',start:3.1,end:6.3,result:'失败',input:'pnpm test login',output:'1 项失败：expired session'},
          {id:6,name:'模型响应',who:'主 agent',start:6.5,end:7.0,result:'已完成',input:'测试返回与当前任务上下文',output:'可见响应：补充边界条件后再验证'},
          {id:7,name:'再次测试',who:'主 agent',start:7.4,end:null,result:'尚未返回',input:'pnpm test login',output:'快照中尚未观察到返回事件'}
        ]},
        a72:{title:'检查测试',host:'Claude Code',status:'等待输入',end:9,calls:[
          {id:1,name:'查找测试',who:'主 agent',start:0,end:1.8,result:'已返回',input:'rg --files tests',output:'找到 4 个测试文件'},
          {id:2,name:'运行测试',who:'主 agent',start:2.2,end:5.4,result:'失败',input:'pnpm test',output:'测试环境缺少 TEST_DATABASE_URL'},
          {id:3,name:'读取配置',who:'主 agent',start:5.9,end:7.8,result:'已返回',input:'tests/setup.ts',output:'已读取测试环境配置'},
          {id:4,name:'等待输入',who:'主 agent',start:8,end:null,result:'等待输入',input:'选择本地或远程测试环境',output:'明确的人机交互请求 · 快照中未观察到回答'}
        ]},
        d09:{title:'审阅文档',host:'dsh',status:'已结束',end:8,calls:[
          {id:1,name:'读取文档',who:'主 agent',start:0,end:1.6,result:'已返回',input:'README.md',output:'读取完成'},
          {id:2,name:'检查链接',who:'主 agent',start:2.1,end:5.7,result:'已返回',input:'docs/ 中的本地文档链接',output:'检查结束 · 未发现失效本地路径'},
          {id:3,name:'读取差异',who:'主 agent',start:6.2,end:7.4,result:'已返回',input:'git diff -- README.md docs/',output:'读取完成'},
          {id:4,name:'交付产物',who:'主 agent',start:7.6,end:7.9,result:'已完成',input:'文档审阅结果',output:'产物 review-notes.md · 会话随后结束'}
        ]}
      };
      const scopes={all:'全部事件',unassigned:'未归属'};
      const attribution={c41:[['unassigned','上下文','运行事件记录','仅观察到加载'],['investigate/i01','工具调用','Hook 记录 · 文件工具','直接：invocation_id（模拟）'],['investigate/i01','工具调用','Hook 记录 · 修改工具','直接：invocation_id（模拟）'],['review/r01','任务委派','任务关系记录','直接：invocation_id（模拟）'],['review/r01','工具调用','Hook 记录 · shell 工具','推断：父子任务关联（模拟）'],['investigate/i01','模型响应','可见响应记录','直接：invocation_id（模拟）'],['unassigned','工具调用','MCP 记录 · tools/call','缺少 Skill 归属证据']],a72:[['investigate/i02','工具调用','Hook 记录 · shell 工具','直接：invocation_id（模拟）'],['investigate/i02','工具调用','Hook 记录 · shell 工具','直接：invocation_id（模拟）'],['unassigned','工具调用','MCP 记录 · tools/call','缺少 Skill 归属证据'],['investigate/i02','人机交互','运行事件记录','直接：invocation_id（模拟）']],d09:[['review/r02','工具调用','Hook 记录 · 文件工具','直接：invocation_id（模拟）'],['review/r02','工具调用','MCP 记录 · tools/call','直接：invocation_id（模拟）'],['unassigned','工具调用','Hook 记录 · shell 工具','缺少 Skill 归属证据'],['review/r02','产物交付','产物记录','直接：invocation_id（模拟）']]};
      Object.entries(sessions).forEach(([id,session])=>session.calls.forEach((call,index)=>{const [skill,kind,source,basis]=attribution[id][index];Object.assign(call,{skill,kind,source,basis});if(skill!=='unassigned'){const[name,instance]=skill.split('/');scopes[skill]=name+' · #'+instance;}}));
      let state={session:'c41',selected:{c41:7,a72:4,d09:4},filters:{c41:'all',a72:'all',d09:'all'},sound:'live',replayCall:null};
      const el=(name)=>root.querySelector('[data-'+name+']');
      const time=n=>'00:'+n.toFixed(1).padStart(4,'0');
      function restore(saved){
        const value=saved&&saved.privateContent;
        if(!value||value.version!==1||!sessions[value.session])return;
        state.session=value.session;
        Object.keys(sessions).forEach(id=>{if(value.selected&&sessions[id].calls.some(c=>c.id===value.selected[id]))state.selected[id]=value.selected[id];if(value.filters&&['all',...sessions[id].calls.map(c=>c.skill)].includes(value.filters[id]))state.filters[id]=value.filters[id];});
        state.sound=value.sound==='replay'?'replay':sessions[state.session].status==='已结束'?'quiet':'live';
        state.replayCall=sessions[state.session].calls.some(c=>c.id===value.replayCall)?value.replayCall:null;
        if(state.sound==='replay'&&!state.replayCall)state.sound=sessions[state.session].status==='已结束'?'quiet':'live';
      }
      function save(){
        if(!window.openai||typeof window.openai.setWidgetState!=='function')return;
        window.openai.setWidgetState({modelContent:{viewedSession:state.session,skillScope:state.filters[state.session],inspectedCall:state.selected[state.session],soundMode:state.sound,replayCall:state.replayCall},privateContent:{version:1,...state}}).catch(()=>{});
      }
      function render(announce){
        const focusedCall=document.activeElement&&document.activeElement.closest('[data-call]');
        const focusedId=focusedCall&&root.contains(focusedCall)?focusedCall.dataset.call:null;
        const session=sessions[state.session],filter=state.filters[state.session],visible=session.calls.filter(c=>filter==='all'||c.skill===filter);
        if(!visible.some(c=>c.id===state.selected[state.session]))state.selected[state.session]=visible[0].id;
        const call=visible.find(c=>c.id===state.selected[state.session]);
        el('skill').replaceChildren(...['all',...new Set(session.calls.map(c=>c.skill))].map(value=>{const option=document.createElement('option');option.value=value;option.textContent=scopes[value];option.selected=value===filter;return option;}));
        root.querySelectorAll('[data-session]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.session===state.session)));
        el('title').textContent=session.title;
        el('identity').textContent=session.host+' · #'+state.session+' · '+session.status+' · 模拟快照 '+time(session.end);
        el('position').textContent='查看：记录 #'+call.id;
        el('axis-end').textContent=time(session.end);
        el('calls').replaceChildren(...visible.map(c=>{
          const button=document.createElement('button');button.type='button';button.className='ss-call cursor-interaction';button.dataset.call=c.id;button.setAttribute('aria-pressed',String(c.id===call.id));
          button.setAttribute('aria-label','记录 '+c.id+'，'+c.name+'，'+c.who+'，'+time(c.start)+' 开始，'+(c.end===null?'截至快照尚无结束记录':time(c.end)+' 结束')+'，'+c.result);
          const label=document.createElement('span'),name=document.createElement('span'),who=document.createElement('span');name.className='ss-call-name';who.className='ss-call-who';name.textContent='#'+c.id+' '+c.name;who.textContent=c.who+(c.basis.startsWith('推断')?' · 关联待确认':'');label.append(name,who);
          const track=document.createElement('span'),bar=document.createElement('span');track.className='ss-track';track.setAttribute('aria-hidden','true');bar.className='ss-bar'+(c.end===null?' ss-open':'');bar.style.left=(c.start/session.end*100)+'%';bar.style.width=((c.end===null?session.end:c.end)-c.start)/session.end*100+'%';track.append(bar);
          const result=document.createElement('span');result.className='ss-result'+(c.result==='失败'?' ss-fail':'');result.textContent=c.result;button.append(label,track,result);return button;
        }));
        el('detail-title').textContent='#'+call.id+' '+call.name+' · '+call.who;
        const details=[['时间',time(call.start)+' 开始 → '+(call.end===null?call.result+' · 已过 '+(session.end-call.start).toFixed(1)+'s（快照）':time(call.end)+' 结束')],['类型',call.kind+' · '+call.source],['归属',scopes[call.skill]+' · '+call.basis],['输入',call.input],['结果',call.output]];
        el('detail').replaceChildren(...details.flatMap(([label,value])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;if(label==='输入')dd.className='ss-mono';return[dt,dd];}));
        el('sound-session').textContent=session.host+' · #'+state.session+' / '+scopes[filter];
        el('sound-detail').textContent=state.sound==='replay'?'回放示意 · 记录 #'+state.replayCall+' · 实时声音暂不呈现':state.sound==='quiet'?'会话已结束 · 无实时声音':filter!=='all'&&filter!=='unassigned'?'实时示意 · 仅含明确归属；待确认关联暂不纳入':'实时示意 · 查看旧记录时，声音仍跟随当前范围';
        el('live').hidden=state.sound!=='replay';el('live').textContent=session.status==='已结束'?'退出回放示意':'回到实时声音';
        el('replay').textContent=state.sound==='replay'&&state.replayCall===call.id?'当前回放焦点':'示意回放此段';
        if(announce)el('announcement').textContent=session.host+' '+state.session+'，查看记录 '+call.id+'，声音模式 '+(state.sound==='replay'?'回放记录 '+state.replayCall:state.sound==='quiet'?'无实时声音':'实时');
        if(focusedId){const focusTarget=root.querySelector('[data-call="'+focusedId+'"]');if(focusTarget)focusTarget.focus({preventScroll:true});}
      }
      root.addEventListener('click',event=>{
        const sessionButton=event.target.closest('[data-session]'),callButton=event.target.closest('[data-call]');
        if(sessionButton){if(state.session===sessionButton.dataset.session)return;state.session=sessionButton.dataset.session;state.sound=sessions[state.session].status==='已结束'?'quiet':'live';state.replayCall=null;}
        else if(callButton){state.selected[state.session]=Number(callButton.dataset.call);}
        else if(event.target.closest('[data-replay]')){state.sound='replay';state.replayCall=state.selected[state.session];}
        else if(event.target.closest('[data-live]')){state.sound=sessions[state.session].status==='已结束'?'quiet':'live';state.replayCall=null;}
        else return;
        render(true);if(callButton)root.querySelector('[data-call="'+state.selected[state.session]+'"]').focus({preventScroll:true});save();
      });
      el('skill').addEventListener('change',event=>{state.filters[state.session]=event.target.value;state.sound=sessions[state.session].status==='已结束'?'quiet':'live';state.replayCall=null;render(true);save();});
      restore(window.openai&&window.openai.widgetState);render(false);
      window.addEventListener('openai:set_globals',event=>{if(event.detail&&event.detail.globals&&event.detail.globals.widgetState){restore(event.detail.globals.widgetState);render(false);}});
    })();
  </script>
</div>
